[flyway]
defaultSchema = "dbo"
locations = ["filesystem:migrations"]

[environments.dev]
url = "jdbc:sqlserver://localhost:1433;databaseName=FlywaySample_Dev;encrypt=true;trustServerCertificate=true"
user = "sa"
password = "${DEV_DATABASE_PASSWORD}"
schemas = ["dbo"]

[environments.staging]
url = "jdbc:sqlserver://localhost:1433;databaseName=FlywaySample_Staging;encrypt=true;trustServerCertificate=true"
user = "sa"
password = "${STAGING_DATABASE_PASSWORD}"
schemas = ["dbo"]

[environments.production]
url = "jdbc:sqlserver://localhost:1433;databaseName=FlywaySample_Prod;encrypt=true;trustServerCertificate=true"
user = "sa"
password = "${PRODUCTION_DATABASE_PASSWORD}"
schemas = ["dbo"]

[environments.build]
url = "jdbc:sqlserver://localhost:1433;databaseName=FlywaySample_Build;encrypt=true;trustServerCertificate=true"
user = "sa"
password = "${BUILD_DATABASE_PASSWORD}"
schemas = ["dbo"]
