name: Setup Demo Environment
description: Creates databases and optionally seeds drift for demo workflows

inputs:
  sqlserver-container-id:
    description: "SQL Server container ID (from job.services.sqlserver.id)"
    required: true
  database-name:
    description: "Target database name to create"
    required: true
  create-build-db:
    description: "Also create the FlywaySample_Build database"
    required: false
    default: "false"
  seed-drift:
    description: "Seed the target DB to v003 then introduce an out-of-band change"
    required: false
    default: "false"
  target-environment:
    description: "Flyway environment name (from flyway.toml)"
    required: false
    default: ""
  target-password:
    description: "Password for the target environment database"
    required: false
    default: ""
  working-directory:
    description: "Path to the Flyway project directory"
    required: false
    default: "."

runs:
  using: composite
  steps:
    - name: Wait for SQL Server
      shell: bash
      run: |
        for i in {1..30}; do
          docker exec ${{ inputs.sqlserver-container-id }} /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -U sa -P "$BUILD_DATABASE_PASSWORD" -C -Q "SELECT 1" > /dev/null 2>&1 && break
          echo "Waiting for SQL Server... ($i/30)"
          sleep 2
        done

    - name: Create target database
      shell: bash
      run: |
        docker exec ${{ inputs.sqlserver-container-id }} /opt/mssql-tools18/bin/sqlcmd \
          -S localhost -U sa -P "$BUILD_DATABASE_PASSWORD" -C -Q "CREATE DATABASE [${{ inputs.database-name }}]"

    - name: Create build database
      if: inputs.create-build-db == 'true'
      shell: bash
      run: |
        docker exec ${{ inputs.sqlserver-container-id }} /opt/mssql-tools18/bin/sqlcmd \
          -S localhost -U sa -P "$BUILD_DATABASE_PASSWORD" -C -Q "CREATE DATABASE [FlywaySample_Build]"

    - name: Seed target database (simulate prior deployments)
      if: inputs.seed-drift == 'true'
      uses: red-gate/flyway-actions/migrations/deploy@v2
      with:
        target-environment: ${{ inputs.target-environment }}
        target-password: ${{ inputs.target-password }}
        target-migration-version: "003"
        skip-drift-check: true
        working-directory: ${{ inputs.working-directory }}

    - name: Introduce out-of-band change (simulate drift)
      if: inputs.seed-drift == 'true'
      shell: bash
      run: |
        docker exec ${{ inputs.sqlserver-container-id }} /opt/mssql-tools18/bin/sqlcmd \
          -S localhost -U sa -P "$BUILD_DATABASE_PASSWORD" -C -Q \
          "USE [${{ inputs.database-name }}]; ALTER TABLE users ADD phone_number NVARCHAR(50) NULL;"
