name: Setup State Demo Environment
description: Creates target database and seeds it to simulate a prior deployment

inputs:
  sqlserver-container-id:
    description: "SQL Server container ID (from job.services.sqlserver.id)"
    required: true
  database-name:
    description: "Target database name to create"
    required: true
  seed-drift:
    description: "Deploy the full schema model then introduce an out-of-band change to simulate drift"
    required: false
    default: "false"
  target-environment:
    description: "Flyway environment name (from flyway.toml)"
    required: false
    default: ""
  target-password:
    description: "Password for the target environment database"
    required: false
    default: ""
  working-directory:
    description: "Path to the Flyway state project directory"
    required: false
    default: "."

runs:
  using: composite
  steps:
    - name: Wait for SQL Server
      shell: bash
      run: |
        for i in {1..30}; do
          docker exec ${{ inputs.sqlserver-container-id }} /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -U sa -P "$BUILD_DATABASE_PASSWORD" -C -Q "SELECT 1" > /dev/null 2>&1 && break
          echo "Waiting for SQL Server... ($i/30)"
          sleep 2
        done

    - name: Create target database
      shell: bash
      run: |
        docker exec ${{ inputs.sqlserver-container-id }} /opt/mssql-tools18/bin/sqlcmd \
          -S localhost -U sa -P "$BUILD_DATABASE_PASSWORD" -C -Q "CREATE DATABASE [${{ inputs.database-name }}]"

    - name: Seed target database (simulate prior deployment)
      shell: bash
      env:
        TARGET_ENV: ${{ inputs.target-environment }}
        TARGET_PASSWORD: ${{ inputs.target-password }}
        WORKING_DIR: ${{ inputs.working-directory }}
        SEED_DRIFT: ${{ inputs.seed-drift }}
      run: |
        # Use seed-schema (partial) for normal runs, full schemaModel for drift runs
        if [ "$SEED_DRIFT" == "true" ]; then
          SOURCE="schemaModel"
        else
          SOURCE="seed-schema"
        fi

        flyway prepare \
          -source="$SOURCE" \
          -target="$TARGET_ENV" \
          -environments.${TARGET_ENV}.password="$TARGET_PASSWORD" \
          -workingDirectory="$WORKING_DIR" \
          -outputType=json -skipCheckForUpdate

        flyway deploy \
          -environment="$TARGET_ENV" \
          -environments.${TARGET_ENV}.password="$TARGET_PASSWORD" \
          -workingDirectory="$WORKING_DIR" \
          -deploy.saveSnapshot=true \
          -outputType=json -skipCheckForUpdate

        # Clean up seed artifacts so the real workflow steps start fresh
        rm -rf "$WORKING_DIR/deployments"

    - name: Introduce out-of-band change (simulate drift)
      if: inputs.seed-drift == 'true'
      shell: bash
      run: |
        docker exec ${{ inputs.sqlserver-container-id }} /opt/mssql-tools18/bin/sqlcmd \
          -S localhost -U sa -P "$BUILD_DATABASE_PASSWORD" -C -Q \
          "USE [${{ inputs.database-name }}]; ALTER TABLE users ADD phone_number NVARCHAR(50) NULL;"
