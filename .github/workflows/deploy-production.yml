name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      migration-version:
        description: 'Migrate up to this version (leave empty for latest)'
        required: false
        type: string
      cherry-pick:
        description: 'Comma-separated migration versions to cherry-pick'
        required: false
        type: string
      skip-drift-check:
        description: 'Skip drift detection'
        required: false
        type: boolean
        default: false

jobs:
  checks:
    uses: ./.github/workflows/zzz-checks.yml
    with:
      target-environment: production
      database-name: FlywaySample_Prod
      environment: production-read-only
      seed-drift: true
      migration-version: ${{ inputs.migration-version }}
      cherry-pick: ${{ inputs.cherry-pick }}
      skip-drift-check: ${{ inputs.skip-drift-check }}
    secrets:
      FLYWAY_EMAIL: ${{ secrets.FLYWAY_EMAIL }}
      FLYWAY_TOKEN: ${{ secrets.FLYWAY_TOKEN }}

  deploy:
    needs: checks
    uses: ./.github/workflows/zzz-deploy.yml
    with:
      target-environment: production
      database-name: FlywaySample_Prod
      environment: production
      migration-version: ${{ inputs.migration-version }}
      cherry-pick: ${{ inputs.cherry-pick }}
      skip-drift-check: ${{ inputs.skip-drift-check }}
    secrets:
      FLYWAY_EMAIL: ${{ secrets.FLYWAY_EMAIL }}
      FLYWAY_TOKEN: ${{ secrets.FLYWAY_TOKEN }}
