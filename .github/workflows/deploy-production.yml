name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      migration-version:
        description: 'Migrate up to this version (leave empty for latest)'
        required: false
        type: string
      cherry-pick:
        description: 'Comma-separated migration versions to cherry-pick'
        required: false
        type: string
      skip-drift-check:
        description: 'Skip drift detection'
        required: false
        type: boolean
        default: false

jobs:
  checks:
    name: Pre-deployment checks
    runs-on: ubuntu-latest
    environment: production-read-only
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Flyway123!"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Flyway123!' -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 10s
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup demo environment
        uses: ./.github/actions/setup-demo
        with:
          sqlserver-container-id: ${{ job.services.sqlserver.id }}
          database-name: FlywaySample_Prod
          create-build-db: "true"
          flyway-email: ${{ secrets.FLYWAY_EMAIL }}
          flyway-token: ${{ secrets.FLYWAY_TOKEN }}
          working-directory: flyway

      - name: Run pre-deployment checks
        uses: red-gate/flyway-actions/migrations/checks@v1
        with:
          target-environment: production
          target-password: ${{ secrets.PRODUCTION_DATABASE_PASSWORD }}
          target-migration-version: ${{ inputs.migration-version }}
          cherry-pick: ${{ inputs.cherry-pick }}
          build-environment: build
          build-password: ${{ secrets.BUILD_DATABASE_PASSWORD }}
          build-ok-to-erase: true
          skip-drift-check: ${{ inputs.skip-drift-check }}
          working-directory: flyway

      - name: Upload drift resolution scripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flyway-drift-resolution-scripts
          path: drift-resolution/
          if-no-files-found: ignore

  deploy:
    name: Deploy migrations
    needs: checks
    runs-on: ubuntu-latest
    environment: production
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Flyway123!"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Flyway123!' -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 10s
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup demo environment
        uses: ./.github/actions/setup-demo
        with:
          sqlserver-container-id: ${{ job.services.sqlserver.id }}
          database-name: FlywaySample_Prod
          flyway-email: ${{ secrets.FLYWAY_EMAIL }}
          flyway-token: ${{ secrets.FLYWAY_TOKEN }}
          working-directory: flyway

      - name: Deploy migrations
        uses: red-gate/flyway-actions/migrations/deploy@v1
        with:
          target-environment: production
          target-password: ${{ secrets.PRODUCTION_DATABASE_PASSWORD }}
          target-migration-version: ${{ inputs.migration-version }}
          cherry-pick: ${{ inputs.cherry-pick }}
          skip-drift-check: ${{ inputs.skip-drift-check }}
          working-directory: flyway
