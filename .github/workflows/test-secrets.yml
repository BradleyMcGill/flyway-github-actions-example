name: Test Secrets

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Verify secret values match expected
        env:
          STAGING_PW: ${{ secrets.STAGING_DATABASE_PASSWORD }}
          BUILD_PW: ${{ secrets.BUILD_DATABASE_PASSWORD }}
          PRODUCTION_PW: ${{ secrets.PRODUCTION_DATABASE_PASSWORD }}
        run: |
          EXPECTED='Flyway123!'

          echo "=== Staging Password ==="
          echo "Length: ${#STAGING_PW}"
          echo "Expected length: ${#EXPECTED}"
          if [ "$STAGING_PW" = "$EXPECTED" ]; then
            echo "MATCH"
          else
            echo "MISMATCH"
            echo "First 5 chars: ${STAGING_PW:0:5}"
            echo "Hex dump:"
            echo -n "$STAGING_PW" | xxd | head -2
          fi

          echo ""
          echo "=== Build Password ==="
          echo "Length: ${#BUILD_PW}"
          if [ "$BUILD_PW" = "$EXPECTED" ]; then
            echo "MATCH"
          else
            echo "MISMATCH"
            echo "Hex dump:"
            echo -n "$BUILD_PW" | xxd | head -2
          fi

          echo ""
          echo "=== Production Password ==="
          echo "Length: ${#PRODUCTION_PW}"
          if [ "$PRODUCTION_PW" = "$EXPECTED" ]; then
            echo "MATCH"
          else
            echo "MISMATCH"
            echo "Hex dump:"
            echo -n "$PRODUCTION_PW" | xxd | head -2
          fi
