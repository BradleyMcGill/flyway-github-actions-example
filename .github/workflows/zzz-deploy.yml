name: _Reusable - Deploy migrations

on:
  workflow_call:
    inputs:
      target-environment:
        description: "Flyway environment name (dev, staging, production)"
        required: true
        type: string
      database-name:
        description: "SQL Server database name (e.g. FlywaySample_Dev)"
        required: true
        type: string
      environment:
        description: "GitHub environment for OIDC / protection rules"
        required: true
        type: string
      migration-version:
        description: "Migrate up to this version"
        required: false
        type: string
      cherry-pick:
        description: "Comma-separated migration versions to cherry-pick"
        required: false
        type: string
      skip-drift-check:
        description: "Skip drift detection"
        required: false
        type: boolean
        default: false
    secrets:
      FLYWAY_EMAIL:
        required: true
      FLYWAY_TOKEN:
        required: true

jobs:
  deploy:
    name: Deploy migrations
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Flyway123!"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Flyway123!' -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 10s
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create databases
        run: |
          docker exec ${{ job.services.sqlserver.id }} /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -U sa -P 'Flyway123!' -C -Q "CREATE DATABASE [${{ inputs.database-name }}]"

      - name: Setup Flyway
        uses: red-gate/setup-flyway@v3
        with:
          edition: enterprise
          i-agree-to-the-eula: true
          email: ${{ secrets.FLYWAY_EMAIL }}
          token: ${{ secrets.FLYWAY_TOKEN }}

      - name: Deploy migrations
        id: deploy
        uses: red-gate/flyway-actions/migrations/deploy@v1
        with:
          target-environment: ${{ inputs.target-environment }}
          target-url: "jdbc:sqlserver://localhost:1433;databaseName=${{ inputs.database-name }};encrypt=true;trustServerCertificate=true"
          target-user: sa
          target-password: "Flyway123!"
          target-migration-version: ${{ inputs.migration-version }}
          cherry-pick: ${{ inputs.cherry-pick }}
          skip-drift-check: ${{ inputs.skip-drift-check }}

      - name: Deployment summary
        if: always()
        run: |
          echo "### ${{ inputs.target-environment }} Deployment Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Drift detected | \`${{ steps.deploy.outputs.drift-detected }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Migrations applied | \`${{ steps.deploy.outputs.migrations-applied }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Schema version | \`${{ steps.deploy.outputs.schema-version }}\` |" >> $GITHUB_STEP_SUMMARY
