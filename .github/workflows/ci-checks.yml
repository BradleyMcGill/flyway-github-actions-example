name: CI - Migration Checks

on:
  pull_request:
    branches: [main]
    paths:
      - 'migrations/**'
      - 'flyway.toml'

jobs:
  migration-checks:
    name: Pre-deployment checks
    runs-on: ubuntu-latest
    environment: ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flyway
        uses: red-gate/setup-flyway@v3
        with:
          edition: enterprise
          i-agree-to-the-eula: true
          email: ${{ secrets.FLYWAY_EMAIL }}
          token: ${{ secrets.FLYWAY_TOKEN }}

      - name: Run pre-deployment checks
        id: checks
        uses: red-gate/flyway-actions/migrations/checks@v1
        with:
          target-environment: staging
          target-user: ${{ secrets.STAGING_DATABASE_USER }}
          target-password: ${{ secrets.STAGING_DATABASE_PASSWORD }}
          build-environment: build
          build-user: ${{ secrets.BUILD_DATABASE_USER }}
          build-password: ${{ secrets.BUILD_DATABASE_PASSWORD }}
          build-ok-to-erase: true
          # Enterprise checks - all enabled
          skip-code-review: false
          skip-drift-check: false
          skip-deployment-changes-report: false
          skip-deployment-script-review: false
          fail-on-code-review: true
          fail-on-drift: true
          # Report artifact
          pre-deployment-report-name: flyway-ci-report
          pre-deployment-report-retention-days: 14

      - name: Report summary
        if: always()
        run: |
          echo "### Migration Check Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Drift detected | \`${{ steps.checks.outputs.drift-detected }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Changed objects | \`${{ steps.checks.outputs.changed-object-count }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Code violations | \`${{ steps.checks.outputs.code-violation-count }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Violation codes | \`${{ steps.checks.outputs.code-violation-codes }}\` |" >> $GITHUB_STEP_SUMMARY
