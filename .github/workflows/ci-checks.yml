name: CI - Migration Checks

on:
  pull_request:
    branches: [main]
    paths:
      - 'flyway/**'
  workflow_dispatch:
    inputs:
      seed-drift:
        description: 'Seed drift to demo drift detection'
        required: false
        type: boolean
        default: false

jobs:
  checks:
    permissions:
      contents: read
      security-events: write
    name: Pre-deployment checks
    runs-on: ubuntu-latest
    environment: ci
    env:
      BUILD_DATABASE_PASSWORD: ${{ secrets.BUILD_DATABASE_PASSWORD }}
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: ${{ secrets.BUILD_DATABASE_PASSWORD }}
        ports:
          - 1433:1433
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Flyway Enterprise
        uses: red-gate/setup-flyway@v3
        with:
          edition: enterprise
          i-agree-to-the-eula: true
          email: ${{ secrets.FLYWAY_EMAIL }}
          token: ${{ secrets.FLYWAY_TOKEN }}

      - name: Setup demo environment
        uses: ./.github/actions/setup-demo
        with:
          sqlserver-container-id: ${{ job.services.sqlserver.id }}
          database-name: FlywaySample_Staging
          create-build-db: "true"
          seed-drift: ${{ inputs.seed-drift == true && 'true' || 'false' }}
          target-environment: staging
          target-password: ${{ secrets.STAGING_DATABASE_PASSWORD }}
          working-directory: flyway

      - name: Run pre-deployment checks
        uses: red-gate/flyway-actions/migrations/checks@main
        with:
          target-environment: staging
          target-password: ${{ secrets.STAGING_DATABASE_PASSWORD }}
          build-environment: build
          build-password: ${{ secrets.BUILD_DATABASE_PASSWORD }}
          build-ok-to-erase: true
          working-directory: flyway
