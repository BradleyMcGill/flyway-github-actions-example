name: Demo - Drift Detection

on:
  workflow_dispatch:

jobs:
  checks:
    name: Pre-deployment checks (with seeded drift)
    runs-on: ubuntu-latest
    environment: ci
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Flyway123!"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Flyway123!' -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 10s
    env:
      STAGING_DATABASE_PASSWORD: ${{ secrets.STAGING_DATABASE_PASSWORD }}
      BUILD_DATABASE_PASSWORD: ${{ secrets.BUILD_DATABASE_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup demo environment
        uses: ./.github/actions/setup-demo
        with:
          sqlserver-container-id: ${{ job.services.sqlserver.id }}
          database-name: FlywaySample_Staging
          create-build-db: "true"
          flyway-email: ${{ secrets.FLYWAY_EMAIL }}
          flyway-token: ${{ secrets.FLYWAY_TOKEN }}
          seed-drift: "true"
          target-environment: staging

      - name: Run pre-deployment checks
        uses: red-gate/flyway-actions/migrations/checks@v1
        with:
          target-environment: staging
          build-environment: build
          build-ok-to-erase: true
          extra-args: -check.deployedSnapshot=deployed-snapshot.json

      - name: Upload pre-deployment report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flyway-staging-report
          path: report.html
          if-no-files-found: ignore

      - name: Upload drift resolution scripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flyway-staging-drift-resolution
          path: drift-resolution/
          if-no-files-found: ignore
