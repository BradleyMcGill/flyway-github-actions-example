name: _Reusable - Pre-deployment checks

on:
  workflow_call:
    inputs:
      target-environment:
        description: "Flyway environment name (dev, staging, production)"
        required: true
        type: string
      database-name:
        description: "SQL Server database name (e.g. FlywaySample_Dev)"
        required: true
        type: string
      environment:
        description: "GitHub environment for OIDC / protection rules"
        required: true
        type: string
      seed-drift:
        description: "Seed target DB and introduce drift for demo"
        required: false
        type: boolean
        default: false
      migration-version:
        description: "Migrate up to this version"
        required: false
        type: string
      cherry-pick:
        description: "Comma-separated migration versions to cherry-pick"
        required: false
        type: string
      skip-drift-check:
        description: "Skip drift detection"
        required: false
        type: boolean
        default: false
    secrets:
      FLYWAY_EMAIL:
        required: true
      FLYWAY_TOKEN:
        required: true

jobs:
  checks:
    name: Pre-deployment checks
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Flyway123!"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Flyway123!' -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 10s
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create databases
        run: |
          docker exec ${{ job.services.sqlserver.id }} /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -U sa -P 'Flyway123!' -C -Q "CREATE DATABASE [${{ inputs.database-name }}]"
          docker exec ${{ job.services.sqlserver.id }} /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -U sa -P 'Flyway123!' -C -Q "CREATE DATABASE [FlywaySample_Build]"

      - name: Setup Flyway
        uses: red-gate/setup-flyway@v3
        with:
          edition: enterprise
          i-agree-to-the-eula: true
          email: ${{ secrets.FLYWAY_EMAIL }}
          token: ${{ secrets.FLYWAY_TOKEN }}

      - name: Seed target database (simulate prior deployments)
        if: inputs.seed-drift
        run: |
          flyway migrate \
            -environment=${{ inputs.target-environment }} \
            -url="jdbc:sqlserver://localhost:1433;databaseName=${{ inputs.database-name }};encrypt=true;trustServerCertificate=true" \
            -user=sa \
            -password="Flyway123!" \
            -target=003

      - name: Save deployment snapshot (baseline for drift comparison)
        if: inputs.seed-drift
        run: |
          flyway snapshot \
            -filename=deployed-snapshot.json \
            -url="jdbc:sqlserver://localhost:1433;databaseName=${{ inputs.database-name }};encrypt=true;trustServerCertificate=true" \
            -user=sa \
            -password="Flyway123!"

      - name: Introduce out-of-band change (simulate drift)
        if: inputs.seed-drift
        run: |
          docker exec ${{ job.services.sqlserver.id }} /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -U sa -P 'Flyway123!' -C -Q \
            "USE [${{ inputs.database-name }}]; ALTER TABLE users ADD phone_number NVARCHAR(50) NULL;"

      - name: Run pre-deployment checks
        id: checks
        uses: red-gate/flyway-actions/migrations/checks@v1
        with:
          target-environment: ${{ inputs.target-environment }}
          target-url: "jdbc:sqlserver://localhost:1433;databaseName=${{ inputs.database-name }};encrypt=true;trustServerCertificate=true"
          target-user: sa
          target-password: "Flyway123!"
          target-migration-version: ${{ inputs.migration-version }}
          cherry-pick: ${{ inputs.cherry-pick }}
          build-environment: build
          build-url: "jdbc:sqlserver://localhost:1433;databaseName=FlywaySample_Build;encrypt=true;trustServerCertificate=true"
          build-user: sa
          build-password: "Flyway123!"
          build-ok-to-erase: true
          skip-code-review: false
          skip-drift-check: ${{ inputs.skip-drift-check }}
          skip-deployment-changes-report: false
          skip-deployment-script-review: false
          fail-on-code-review: true
          fail-on-drift: true
          extra-args: ${{ inputs.seed-drift && '-check.deployedSnapshot=deployed-snapshot.json' || '' }}

      - name: Upload pre-deployment report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flyway-${{ inputs.target-environment }}-report
          path: report.html
          if-no-files-found: ignore

      - name: Upload drift resolution scripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flyway-${{ inputs.target-environment }}-drift-resolution
          path: drift-resolution/
          if-no-files-found: ignore

      - name: Check results summary
        if: always()
        run: |
          echo "## ${{ inputs.target-environment }} Pre-Deployment Check Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ ! -f report.json ]; then
            echo "> No report generated — checks may not have run." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          # --- Deployment Script Review (dryrun) ---
          DRYRUN=$(jq -r '.individualResults[]? | select(.operation=="dryrun") // empty' report.json 2>/dev/null)
          if [ -n "$DRYRUN" ]; then
            echo "### Deployment Script Review" >> $GITHUB_STEP_SUMMARY
            echo '```sql' >> $GITHUB_STEP_SUMMARY
            jq -r '.individualResults[] | select(.operation=="dryrun") | .dryRunScript // "No script generated"' report.json >> $GITHUB_STEP_SUMMARY 2>/dev/null
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          # --- Code Review ---
          CODE_RESULTS=$(jq -r '[.individualResults[]? | select(.operation=="code")] | length' report.json 2>/dev/null)
          if [ "$CODE_RESULTS" -gt 0 ] 2>/dev/null; then
            TOTAL_VIOLATIONS=$(jq -r '[.individualResults[] | select(.operation=="code") | .results[]?.violations[]?] | length' report.json 2>/dev/null)
            echo "### Code Review" >> $GITHUB_STEP_SUMMARY
            if [ "$TOTAL_VIOLATIONS" -gt 0 ] 2>/dev/null; then
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "**$TOTAL_VIOLATIONS violation(s) found:**" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "| File | Line | Rule | Severity | Description |" >> $GITHUB_STEP_SUMMARY
              echo "|------|------|------|----------|-------------|" >> $GITHUB_STEP_SUMMARY
              jq -r '.individualResults[] | select(.operation=="code") | .results[]? as $r | $r.violations[]? | "| \($r.filepath // "-" | split("/") | last) | \(.line // "-") | `\(.code // "-")` | \(.severity // "-") | \(.description // "-") |"' report.json >> $GITHUB_STEP_SUMMARY 2>/dev/null
            else
              echo "No violations found." >> $GITHUB_STEP_SUMMARY
            fi
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          # --- Drift Detection ---
          DRIFT_RESULTS=$(jq -r '[.individualResults[]? | select(.operation=="drift")] | length' report.json 2>/dev/null)
          if [ "$DRIFT_RESULTS" -gt 0 ] 2>/dev/null; then
            echo "### Drift Detection" >> $GITHUB_STEP_SUMMARY
            IN_TARGET=$(jq -r '[.individualResults[] | select(.operation=="drift") | .onlyInTarget[]?] | length' report.json 2>/dev/null)
            IN_SOURCE=$(jq -r '[.individualResults[] | select(.operation=="drift") | .onlyInSource[]?] | length' report.json 2>/dev/null)
            DIFFS=$(jq -r '[.individualResults[] | select(.operation=="drift") | .differences[]?] | length' report.json 2>/dev/null)
            if [ "$((IN_TARGET + IN_SOURCE + DIFFS))" -gt 0 ] 2>/dev/null; then
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "**Drift detected!** Objects have changed outside of Flyway." >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "| Category | Object |" >> $GITHUB_STEP_SUMMARY
              echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
              jq -r '.individualResults[] | select(.operation=="drift") | (.onlyInTarget[]? | "| Added to database | `\(.)`  |"), (.onlyInSource[]? | "| Removed from database | `\(.)` |"), (.differences[]? | "| Modified | `\(.)` |")' report.json >> $GITHUB_STEP_SUMMARY 2>/dev/null
            else
              echo "No drift detected." >> $GITHUB_STEP_SUMMARY
            fi
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          # --- Deployment Changes ---
          CHANGES_RESULTS=$(jq -r '[.individualResults[]? | select(.operation=="changes")] | length' report.json 2>/dev/null)
          if [ "$CHANGES_RESULTS" -gt 0 ] 2>/dev/null; then
            echo "### Deployment Changes" >> $GITHUB_STEP_SUMMARY
            TOTAL_CHANGES=$(jq -r '[.individualResults[] | select(.operation=="changes") | (.onlyInSource[]?, .onlyInTarget[]?, .differences[]?)] | length' report.json 2>/dev/null)
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**$TOTAL_CHANGES object(s) will be changed:**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Category | Object |" >> $GITHUB_STEP_SUMMARY
            echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
            jq -r '.individualResults[] | select(.operation=="changes") | (.onlyInTarget[]? | "| New | `\(.)` |"), (.onlyInSource[]? | "| Removed | `\(.)` |"), (.differences[]? | "| Modified | `\(.)` |")' report.json >> $GITHUB_STEP_SUMMARY 2>/dev/null
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "*Download the full HTML report from the **Artifacts** section.*" >> $GITHUB_STEP_SUMMARY
