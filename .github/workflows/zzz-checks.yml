name: _Reusable - Pre-deployment checks

on:
  workflow_call:
    inputs:
      target-environment:
        description: "Flyway environment name (dev, staging, production)"
        required: true
        type: string
      database-name:
        description: "SQL Server database name (e.g. FlywaySample_Dev)"
        required: true
        type: string
      environment:
        description: "GitHub environment for OIDC / protection rules"
        required: true
        type: string
      seed-drift:
        description: "Seed target DB and introduce drift for demo"
        required: false
        type: boolean
        default: false
      migration-version:
        description: "Migrate up to this version"
        required: false
        type: string
      cherry-pick:
        description: "Comma-separated migration versions to cherry-pick"
        required: false
        type: string
      skip-drift-check:
        description: "Skip drift detection"
        required: false
        type: boolean
        default: false
    secrets:
      FLYWAY_EMAIL:
        required: true
      FLYWAY_TOKEN:
        required: true

jobs:
  checks:
    name: Pre-deployment checks
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Flyway123!"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Flyway123!' -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 10s
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create databases
        run: |
          docker exec ${{ job.services.sqlserver.id }} /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -U sa -P 'Flyway123!' -C -Q "CREATE DATABASE [${{ inputs.database-name }}]"
          docker exec ${{ job.services.sqlserver.id }} /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -U sa -P 'Flyway123!' -C -Q "CREATE DATABASE [FlywaySample_Build]"

      - name: Setup Flyway
        uses: red-gate/setup-flyway@v3
        with:
          edition: enterprise
          i-agree-to-the-eula: true
          email: ${{ secrets.FLYWAY_EMAIL }}
          token: ${{ secrets.FLYWAY_TOKEN }}

      - name: Seed target database (simulate prior deployments)
        if: inputs.seed-drift
        run: |
          flyway migrate \
            -environment=${{ inputs.target-environment }} \
            -url="jdbc:sqlserver://localhost:1433;databaseName=${{ inputs.database-name }};encrypt=true;trustServerCertificate=true" \
            -user=sa \
            -password="Flyway123!" \
            -target=003

      - name: Introduce out-of-band change (simulate drift)
        if: inputs.seed-drift
        run: |
          docker exec ${{ job.services.sqlserver.id }} /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -U sa -P 'Flyway123!' -C -Q \
            "USE [${{ inputs.database-name }}]; ALTER TABLE users ADD phone_number NVARCHAR(50) NULL;"

      - name: Run pre-deployment checks
        id: checks
        uses: red-gate/flyway-actions/migrations/checks@v1
        with:
          target-environment: ${{ inputs.target-environment }}
          target-url: "jdbc:sqlserver://localhost:1433;databaseName=${{ inputs.database-name }};encrypt=true;trustServerCertificate=true"
          target-user: sa
          target-password: "Flyway123!"
          target-migration-version: ${{ inputs.migration-version }}
          cherry-pick: ${{ inputs.cherry-pick }}
          build-environment: build
          build-url: "jdbc:sqlserver://localhost:1433;databaseName=FlywaySample_Build;encrypt=true;trustServerCertificate=true"
          build-user: sa
          build-password: "Flyway123!"
          build-ok-to-erase: true
          skip-code-review: false
          skip-drift-check: ${{ inputs.skip-drift-check }}
          skip-deployment-changes-report: false
          skip-deployment-script-review: false
          fail-on-code-review: true
          fail-on-drift: true

      - name: Check results summary
        if: always()
        run: |
          echo "### ${{ inputs.target-environment }} Pre-Deployment Check Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Drift detected | \`${{ steps.checks.outputs.drift-detected || '-' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Changed objects | \`${{ steps.checks.outputs.changed-object-count || '-' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Code violations | \`${{ steps.checks.outputs.code-violation-count || '-' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Violation codes | \`${{ steps.checks.outputs.code-violation-codes || '-' }}\` |" >> $GITHUB_STEP_SUMMARY
