name: Deploy to Staging

on:
  workflow_dispatch:

jobs:
  checks:
    name: Pre-deployment checks
    runs-on: ubuntu-latest
    environment: staging-read-only
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Flyway123!"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Flyway123!' -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 10s
    env:
      STAGING_DATABASE_PASSWORD: ${{ secrets.STAGING_DATABASE_PASSWORD }}
      BUILD_DATABASE_PASSWORD: ${{ secrets.BUILD_DATABASE_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup demo environment
        uses: ./.github/actions/setup-demo
        with:
          sqlserver-container-id: ${{ job.services.sqlserver.id }}
          database-name: FlywaySample_Staging
          create-build-db: "true"
          flyway-email: ${{ secrets.FLYWAY_EMAIL }}
          flyway-token: ${{ secrets.FLYWAY_TOKEN }}

      - name: Run pre-deployment checks
        uses: red-gate/flyway-actions/migrations/checks@v1
        with:
          target-environment: staging
          build-environment: build
          build-ok-to-erase: true

  deploy:
    name: Deploy migrations
    needs: checks
    runs-on: ubuntu-latest
    environment: staging
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Flyway123!"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Flyway123!' -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 10s
    env:
      STAGING_DATABASE_PASSWORD: ${{ secrets.STAGING_DATABASE_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup demo environment
        uses: ./.github/actions/setup-demo
        with:
          sqlserver-container-id: ${{ job.services.sqlserver.id }}
          database-name: FlywaySample_Staging
          flyway-email: ${{ secrets.FLYWAY_EMAIL }}
          flyway-token: ${{ secrets.FLYWAY_TOKEN }}

      - name: Deploy migrations
        id: deploy
        uses: red-gate/flyway-actions/migrations/deploy@v1
        with:
          target-environment: staging

      - name: Deployment summary
        if: always()
        run: |
          echo "### Staging Deployment Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Drift detected | \`${{ steps.deploy.outputs.drift-detected }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Migrations applied | \`${{ steps.deploy.outputs.migrations-applied }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Schema version | \`${{ steps.deploy.outputs.schema-version }}\` |" >> $GITHUB_STEP_SUMMARY
