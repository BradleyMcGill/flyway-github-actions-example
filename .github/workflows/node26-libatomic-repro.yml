name: Node 26 libatomic repro

on:
  push:
    branches: ['demo/node26-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  container:
    name: ${{ matrix.image }} | ${{ matrix.node }} | libatomic ${{ matrix.libatomic }}
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
      options: --user 0
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:24.04', 'debian:12-slim', 'ghcr.io/actions/actions-runner:2.337.0']
        node: ['lts/*', '24']
        libatomic: [absent]
        include:
          - image: 'ubuntu:24.04'
            node: 'lts/*'
            libatomic: installed
          - image: 'ghcr.io/actions/actions-runner:2.337.0'
            node: 'lts/*'
            libatomic: installed
    steps:
      - name: Report glibc and libatomic
        shell: bash
        run: |
          ldd --version | sed -n 1p
          ls /usr/lib/*/libatomic.so.1 2>/dev/null || echo "libatomic.so.1 MISSING"

      - name: Install libatomic1
        if: matrix.libatomic == 'installed'
        shell: bash
        run: apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libatomic1

      - name: Install Node.js (same inputs as flyway-actions composites)
        id: setup
        continue-on-error: true
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Result
        shell: bash
        run: |
          echo "setup-node outcome: ${{ steps.setup.outcome }}"
          node --version || true
          [ "${{ steps.setup.outcome }}" = success ]

  krypton:
    name: ${{ matrix.image }} | lts/krypton | libatomic absent | toolcache ${{ matrix.toolcache }}
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
      options: --user 0
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:24.04', 'debian:12-slim', 'ghcr.io/actions/actions-runner:2.337.0']
        toolcache: [runner, empty]
    steps:
      - name: Report glibc and libatomic
        shell: bash
        run: |
          ldd --version | sed -n 1p
          ls /usr/lib/*/libatomic.so.1 2>/dev/null || echo "libatomic.so.1 MISSING"

      - name: Install Node.js (lts/krypton, proposed flyway-actions input)
        uses: actions/setup-node@v7
        env:
          RUNNER_TOOL_CACHE: ${{ matrix.toolcache == 'empty' && '/tmp/empty-toolcache' || runner.tool_cache }}
        with:
          node-version: 'lts/krypton'

      - name: Assert Node 24
        shell: bash
        run: |
          node_version="$(node --version)"
          echo "node --version: $node_version"
          [[ "$node_version" == v24.* ]]

  hosted-control:
    name: ubuntu-latest (no container) | lts/*
    runs-on: ubuntu-latest
    steps:
      - name: Report libatomic
        run: ls /usr/lib/*/libatomic.so.1 2>/dev/null || echo "libatomic.so.1 MISSING"
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
      - run: node --version
